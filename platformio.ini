[env]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = default_ffat.csv
monitor_speed = 115200
build_flags = -DMONSTER_EYES_MAX_EYES=1
lib_ldf_mode = deep
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit BusIO
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit ILI9341
  adafruit/Adafruit GC9A01A
  adafruit/Adafruit SPIFlash
  adafruit/SdFat - Adafruit Fork
  adafruit/Adafruit TinyUSB Library
  bblanchon/ArduinoJson
  knolleary/PubSubClient

; Standalone eye
[env:cyd]

; Two-board pair linked over I2C on CN1 (IO27 SDA, IO22 SCL, GND)
[env:cyd_primary]
build_flags = ${env.build_flags} -DEYES_ROLE_PRIMARY

[env:cyd_secondary]
build_flags = ${env.build_flags} -DEYES_ROLE_SECONDARY
